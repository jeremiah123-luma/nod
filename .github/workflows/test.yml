name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The tests never touch a camera or the mouse, so the headless OpenCV build is enough.
      - run: pip install numpy opencv-python-headless mediapipe
      - run: python -m unittest discover -s tests -t .
